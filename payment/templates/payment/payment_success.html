{% extends 'base.html' %}
{% load static %}

{% block content %}
<header class="bg-dark py-5">
    <div class="container px-4 px-lg-5 my-5">
        <div class="text-center text-white">
            <h1 class="display-4 fw-bolder text-success">Order Confirmed!</h1>
            <p class="lead fw-normal text-white-50 mb-0">Thank you for shopping with VILLEMATIC</p>
        </div>
    </div>
</header>

<div class="container my-5 text-center">
    <div class="row justify-content-center">
        <div class="col-lg-6">
            <div class="card shadow-sm border-success">
                <div class="card-body py-5">
                    <i class="bi bi-check-circle-fill text-success" style="font-size: 4rem;"></i>
                    <h3 class="mt-3 fw-bold">Your order has been placed!</h3>
                    <p class="text-muted">A confirmation has been logged to your account. You can track your order in the My Orders section.</p>
                    <div class="d-flex gap-2 justify-content-center mt-4">
                        <a href="{% url 'orders' %}" class="btn btn-dark">
                            <i class="bi bi-bag-check me-1"></i> View My Orders
                        </a>
                        <a href="{% url 'home' %}" class="btn btn-outline-dark">
                            <i class="bi bi-house me-1"></i> Continue Shopping
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
