{% extends 'base.html' %}
{% block content %}
<!-- Header-->
        <div class="container">
            <br>
            <br>
            <br>
           <div class="card mb-3">
  <div class="row g-0">
    <div class="col-md-4">
      <img src="{{ product.image.url }}" class="img-fluid rounded-start" alt="...">
    </div>
    <div class="col-md-8">
      <div class="card-body">
        <center>
        <h5 class="card-title">{{ product.name }}</h5>
        <p class="card-text"> {{ product.description  }}  </p>

        {% if product.sale_price %}
        <!-- Product price-->
                                    <strike>${{ product.price }}</strike>
                                    <br>
                                    ${{ product.sale_price }}
                                    <br>
                                    <br>


        {% else %}
        <!-- Product price-->
                                    
                                   ${{ product.price }}
                                   <br>
                                   <br>
                                   <br>

        {% endif %}



        <a href="{% url 'home' %}" class="btn btn-secondary">Return to Home</a>
        <button class="btn btn-secondary" type="button" value="{{ product.id }}"  id="add-cart">Add to cart</button>
        </center>
      </div>
    </div>
  </div>
</div>
        </div>

        <br>
        <br>
        <br>
        <br>
        <br>


        <script>
          // check if button pressed
          $(document).on('click', '#add-cart', function(e){
            // makes a onclick only responsinve to a specific task
            e.preventDefault();
            // helps to send data to the backend of the server without having to refresh the page
            $.ajax({
              type: 'POST',
              // url path of the request
              url: '{% url "cart_add" %}',
              //how information will be recorded in the database
              data: {
                product_id: $('#add-cart').val(),
                // prevent a hacker for hijack of form
                csrfmiddlewaretoken: '{{ csrf_token }}',
                action: 'post'


              },
              // once successfull then...
              success: function(json){
                // console.log(json)
                document.getElementById('cart_quantity').
                textContent = json.qty
              },
              // once unsuccessful
              error: function(xhr, errmsg, err){

              }





            });



          })
          </script>
{% endblock %}
