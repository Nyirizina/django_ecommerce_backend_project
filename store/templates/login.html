{% extends 'base.html' %}
{% block content %}
<!-- Header-->
        <header class="bg-dark py-5">
            <div class="container px-4 px-lg-5 my-5">
                <div class="text-center text-white">
                    <h1 class="display-4 fw-bolder">Login</h1>
                    <p class="lead fw-normal text-white-50 mb-0">Please enter your credentials to access your account</p>
                </div>
            </div>
        </header>
        <br>
        <br>
        <br>
        <div class="container">
            <div class="row">
                <center>
                    
                <div class="col-md-6 offset-md-3">
                <form method="POST" action="{% url 'login' %}">
                    {% csrf_token %}
                    <div class="mb-3">
  <input type="text" class="form-control" placeholder="username" name="username">
                    </div>
<input type="password" name="password" class="form-control" placeholder="password" >
<div class="form-text">
  Your password must be 8-20 characters long, contain letters and numbers, and must not contain spaces, special characters, or emoji.
</div>
<button type="submit" class="btn btn-secondary mt-3  " name="login" >Login</button>
</form>
                </div>

                    <br>
                    <br>
                    <br>
                    <br>
                    <br>
                </center>
            </div>
{% endblock %}
